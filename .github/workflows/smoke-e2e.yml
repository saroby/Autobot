name: smoke-e2e

# 단위 회귀 슈트(tests/run_tests.sh)가 잡지 못하는 실제 Xcode/simulator 회귀 보호.
# 매일 09:00 UTC (18:00 KST) 와 수동 트리거.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  smoke:
    # macos-26 ships Xcode 26 + iOS 26 sims; macos-15 defaults to Xcode 16 and
    # was the reason this job never built an iOS 26 app. (Functional gate proof
    # lives in e2e-verify.yml; this stays a basic scaffold→build→launch smoke.)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -E "^Xcode" || true
          # macos-15 runner 의 최신 Xcode 사용. 26 미만이면 즉시 실패.
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || \
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Unit regression
        run: bash tests/run_tests.sh

      - name: Smoke e2e
        run: bash scripts/smoke-e2e.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e-logs
          path: |
            /tmp/autobot-smoke-*/
          retention-days: 7

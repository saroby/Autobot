name: GreenApp
options:
  bundleIdPrefix: com.autobot.e2e
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  GreenApp:
    type: application
    platform: iOS
    sources:
      - path: GreenApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autobot.e2e.GreenApp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  GreenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GreenAppTests
    dependencies:
      - target: GreenApp
schemes:
  GreenApp:
    build:
      targets:
        GreenApp: all
        GreenAppTests: [test]
    test:
      targets:
        - GreenAppTests
    run:
      config: Debug
    archive:
      config: Release

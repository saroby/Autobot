[project]
name = "autobot"
version = "0.14.0"
description = "Idea-to-ship comprehensive development plugin: product blueprinting (SSOT interviews, per-screen specs), parallel-agent build pipeline with self-improving retrospectives, deployment, and store operations (metadata, screenshots, review submission). The build pipeline's current implementation targets iOS 26+; standalone commands (ssot, screen, make, feedback, ...) work in any project."
requires-python = ">=3.10"

[project.optional-dependencies]
# Required by scripts/visual_contract.py and the design_system gate.
# Without it, visual_contract gates degrade to skip.
visual = ["Pillow>=10.0"]

[tool.autobot]
# Test runner: stdlib unittest. No third-party dependency required.
# Run: python3 -m unittest discover -s tests -p 'test_*.py'
test-command = "python3 -m unittest discover -s tests -p 'test_*.py'"

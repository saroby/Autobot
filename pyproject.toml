[project]
name = "autobot"
version = "0.13.4"
description = "App idea to App Store review in one command. Enterprise-grade iOS 26+ app builder with parallel agent orchestration, self-improving build process, and end-to-end ASO-optimized review submission (metadata + screenshots + binary + AXI-Homepage product registration)."
requires-python = ">=3.10"

[project.optional-dependencies]
# Required by scripts/visual_contract.py and the design_system gate.
# Without it, visual_contract gates degrade to skip.
visual = ["Pillow>=10.0"]

[tool.autobot]
# Test runner: stdlib unittest. No third-party dependency required.
# Run: python3 -m unittest discover -s tests -p 'test_*.py'
test-command = "python3 -m unittest discover -s tests -p 'test_*.py'"
